<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lignes ferroviaires RP</title>
<style>
:root{--bg:#f4ecdc;--panel:#fbf6ea;--ink:#2b2217;--mut:#7a6a52;--line:#d6c7a6;--acc:#9a3b1e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1611;--panel:#241e16;--ink:#efe4cc;--mut:#a79879;--line:#3b3224;--acc:#e0793f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1611;--panel:#241e16;--ink:#efe4cc;--mut:#a79879;--line:#3b3224;--acc:#e0793f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Georgia,"Times New Roman",serif;display:flex;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
h1{font-size:17px;margin:0;letter-spacing:.04em;text-transform:uppercase;color:var(--acc)}
h2{font-size:12px;margin:6px 0 0;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
input[type=text]{width:100%;padding:7px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;font:inherit}
button{font:inherit;padding:6px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:6px;align-items:center}.row>*{min-width:0}
input[type=color]{width:34px;height:32px;padding:0;border:1px solid var(--line);background:none;border-radius:4px;flex:none}
.item{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid transparent;border-radius:4px}
.item.sel{border-color:var(--acc);background:var(--bg)}
.item .sw{width:14px;height:14px;border-radius:3px;flex:none}
.item .nm{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item button{padding:2px 7px}
.hint{color:var(--mut);font-size:12px}
main{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#d4b98c}
main.draw{cursor:crosshair}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage img{display:block;user-select:none;-webkit-user-drag:none}
#ov{position:absolute;left:0;top:0;overflow:visible}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;padding:0;background:var(--panel)}
#msg{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:4px;font-size:12px;display:none}
@media (max-width:760px){body{flex-direction:column-reverse}aside{width:100%;height:42%;border-right:0;border-top:1px solid var(--line)}}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lb{display:flex;align-items:center;gap:4px;border:2px solid var(--c);border-radius:6px;padding:0;overflow:hidden;background:transparent}
.lb .t{flex:1;border:0;background:transparent;color:var(--ink);padding:8px 6px;text-align:left;font-weight:bold;border-radius:0}
.lb.on .t{background:var(--c);color:var(--tc)}
.lb .x{border:0;background:transparent;color:var(--mut);padding:4px 5px}
.lb.on .x{color:var(--tc)}
.lb.sel{outline:2px dashed var(--ink);outline-offset:1px}
.sd b{font-size:12px}.sd div{margin:3px 0;font-size:12px;line-height:1.35}
</style>
</head>
<body>
<aside>
  <h1>Lignes ferroviaires</h1>
  <div class="hint">Trace les lignes de ton serveur directement sur la carte. Tout est sauvegardé dans ton navigateur.</div>

  <h2>Lignes</h2>
  <div class="row"><button id="all">Tout afficher</button><button id="none">Tout masquer</button></div>
  <div id="lines" class="btns"></div>
  <h2>Gares desservies</h2>
  <div id="sd" class="sd"></div>

  <h2>Nouvelle ligne</h2>
  <div class="row"><input type="text" id="lname" placeholder="Nom (ex. Ligne Rose)"><input type="color" id="lcolor" value="#c0392b"></div>
  <div class="row"><button id="addLine">Créer et tracer</button><button id="undo">Annuler point</button><button id="done">Terminer</button></div>

  <h2>Ajouter une gare</h2>
  <div class="row"><input type="text" id="sname" placeholder="Nom de la gare"><button id="addSt">Placer</button></div>
  

  <h2>Données</h2>
  <div class="row"><button id="exp">Exporter</button><button id="imp">Importer</button><button id="theme">Thème</button><button id="reset">Réinitialiser</button></div>
  <input type="file" id="file" accept="application/json" hidden>
</aside>

var S=null,sel=null,mode="nav",pendingStation=null;
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S||!S.lines)S=JSON.parse(JSON.stringify(DEF));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var vp=$("vp"),stage=$("stage"),ov=$("ov"),msg=$("msg");
var k=1,tx=0,ty=0;
function apply(){stage.style.transform="translate("+tx+"px,"+ty+"px) scale("+k+")";draw()}
function fit(){var r=vp.getBoundingClientRect();k=Math.min(r.width/W,r.height/H);tx=(r.width-W*k)/2;ty=(r.height-H*k)/2;apply()}
function say(t){msg.textContent=t;msg.style.display=t?"block":"none"}
function uid(){return Math.random().toString(36).slice(2,9)}
function NS(n,a){var e=document.createElementNS("http://www.w3.org/2000/svg",n);for(var x in a)e.setAttribute(x,a[x]);return e}
function tc(c){var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);return(r*299+g*587+b*114)/1000>150?"#1a1611":"#fff"}
function byId(id){return S.lines.filter(function(x){return x.id===id})[0]}
function pathD(p){return p.map(function(q,i){return(i?"L":"M")+(q[0]*W).toFixed(1)+" "+(q[1]*H).toFixed(1)}).join(" ")}

function draw(){
  ov.innerHTML="";var u=1/k;
  var order=S.lines.filter(function(l){return l.visible!==false&&l.id!==sel}).concat(S.lines.filter(function(l){return l.visible!==false&&l.id===sel}));
  order.forEach(function(l){
    (l.paths||[]).forEach(function(p){
      if(p.length<2)return;var d=pathD(p),on=l.id===sel;
      ov.appendChild(NS("path",{d:d,fill:"none",stroke:"#000","stroke-opacity":.4,"stroke-width":(on?8:6.5)*u,"stroke-linecap":"round","stroke-linejoin":"round"}));
      ov.appendChild(NS("path",{d:d,fill:"none",stroke:l.color,"stroke-width":(on?5.5:4)*u,"stroke-linecap":"round","stroke-linejoin":"round"}))});
    if(l.id===sel&&mode==="draw")(l.paths||[]).forEach(function(p){p.forEach(function(q){ov.appendChild(NS("circle",{cx:q[0]*W,cy:q[1]*H,r:4*u,fill:"#fff",stroke:l.color,"stroke-width":2*u}))})});
  });
  var shown={};S.lines.forEach(function(l){(l.st||[]).forEach(function(n){shown[n]=shown[n]||l.visible!==false})});
  S.stations.forEach(function(s){
    if(s.name in shown&&!shown[s.name])return;
    ov.appendChild(NS("circle",{cx:s.x*W,cy:s.y*H,r:7*u,fill:"#fff",stroke:"#222","stroke-width":2.5*u}));
    var t=NS("text",{x:s.x*W+11*u,y:s.y*H+4*u,"font-size":14*u,"font-weight":"bold",fill:"#222",stroke:"#fff","stroke-width":3.5*u,"paint-order":"stroke","font-family":"Georgia,serif"});t.textContent=s.name;ov.appendChild(t)});
}

function lists(){
  var L=$("lines");L.innerHTML="";
  S.lines.forEach(function(l){
    var d=document.createElement("div");var on=l.visible!==false;
    d.className="lb"+(on?" on":"")+(l.id===sel?" sel":"");d.style.setProperty("--c",l.color);d.style.setProperty("--tc",tc(l.color));
    d.innerHTML='<button class="t"></button><button class="x" title="Tracer / prolonger">✎</button><button class="x" title="Supprimer">✕</button>';
    d.querySelector(".t").textContent=l.name;
    var b=d.querySelectorAll("button");
    b[0].onclick=function(){l.visible=!on;save();lists();draw()};
    b[1].onclick=function(){sel=l.id;l.visible=true;if(!l.paths)l.paths=[];if(!l.paths.length)l.paths.push([]);setMode("draw");save();lists();draw()};
    b[2].onclick=function(){S.lines=S.lines.filter(function(x){return x!==l});if(sel===l.id)sel=null;save();lists();draw()};
    L.appendChild(d)});
  var D=$("sd");D.innerHTML="";
  S.lines.filter(function(l){return l.visible!==false&&(l.st||[]).length}).forEach(function(l){
    var d=document.createElement("div");d.innerHTML='<b style="color:'+l.color+'"></b> <span></span>';
    d.querySelector("b").textContent=l.name+" :";d.querySelector("span").textContent=l.st.join(" · ");D.appendChild(d)});
  if(!D.children.length)D.innerHTML='<div class="hint">Affiche une ligne pour voir ses gares.</div>';
}

function setMode(m){
  mode=m;vp.classList.toggle("draw",m!=="nav");
  if(m==="draw"){var l=byId(sel);say("Clique sur la carte pour ajouter des points à « "+(l?l.name:"?")+" »")}
  else if(m==="station")say("Clique sur la carte pour placer « "+pendingStation+" »");
  else say("");
}
$("all").onclick=function(){S.lines.forEach(function(l){l.visible=true});save();lists();draw()};
$("none").onclick=function(){S.lines.forEach(function(l){l.visible=false});save();lists();draw()};
$("addLine").onclick=function(){
  var n=$("lname").value.trim();if(!n){$("lname").focus();return}
  var l={id:uid(),name:n,color:$("lcolor").value,paths:[[]],visible:true,st:[]};
  S.lines.push(l);sel=l.id;$("lname").value="";save();lists();setMode("draw");draw()};
$("undo").onclick=function(){var l=byId(sel);if(l&&l.paths&&l.paths.length){var p=l.paths[l.paths.length-1];p.pop();save();draw()}};
$("done").onclick=function(){setMode("nav");sel=null;lists();draw()};
$("addSt").onclick=function(){var n=$("sname").value.trim();if(!n){$("sname").focus();return}pendingStation=n;setMode("station")};

var drag=null;
vp.addEventListener("pointerdown",function(e){if(e.target.closest(".zoom"))return;drag={x:e.clientX,y:e.clientY,tx:tx,ty:ty,moved:false};vp.setPointerCapture(e.pointerId)});
vp.addEventListener("pointermove",function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;if(drag.moved){tx=drag.tx+dx;ty=drag.ty+dy;stage.style.transform="translate("+tx+"px,"+ty+"px) scale("+k+")"}});
vp.addEventListener("pointerup",function(e){
  if(!drag)return;var d=drag;drag=null;if(d.moved)return;
  var r=vp.getBoundingClientRect(),x=(e.clientX-r.left-tx)/k/W,y=(e.clientY-r.top-ty)/k/H;
  if(x<0||x>1||y<0||y>1)return;
  if(mode==="draw"){var l=byId(sel);if(l){if(!l.paths||!l.paths.length)l.paths=[[]];l.paths[l.paths.length-1].push([x,y]);save();draw()}}
  else if(mode==="station"){S.stations.push({id:uid(),name:pendingStation,x:x,y:y});$("sname").value="";pendingStation=null;save();setMode("nav");draw()}
});
function zoomAt(f,cx,cy){var nk=Math.max(.2,Math.min(8,k*f));f=nk/k;tx=cx-(cx-tx)*f;ty=cy-(cy-ty)*f;k=nk;apply()}
vp.addEventListener("wheel",function(e){e.preventDefault();var r=vp.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
function mid(){var r=vp.getBoundingClientRect();return[r.width/2,r.height/2]}
$("zi").onclick=function(){var m=mid();zoomAt(1.3,m[0],m[1])};
$("zo").onclick=function(){var m=mid();zoomAt(1/1.3,m[0],m[1])};
$("zr").onclick=fit;
window.addEventListener("resize",fit);

$("exp").onclick=function(){
  var b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="lignes-rp.json";a.click();
  try{navigator.clipboard.writeText(JSON.stringify(S))}catch(x){}
  say("Export lancé (copié aussi dans le presse-papiers si autorisé)");setTimeout(function(){say("")},3000)};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(o.lines&&o.stations){S=o;save();sel=null;lists();draw()}}catch(x){}};r.readAsText(f)};
$("reset").onclick=function(){if($("reset").dataset.c!=="1"){$("reset").dataset.c="1";$("reset").textContent="Confirmer ?";setTimeout(function(){$("reset").dataset.c="";$("reset").textContent="Réinitialiser"},3000);return}
  S=JSON.parse(JSON.stringify(DEF));sel=null;save();setMode("nav");lists();draw();$("reset").dataset.c="";$("reset").textContent="Réinitialiser"};
$("theme").onclick=function(){var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",dark?"light":"dark")};

lists();
$("map").complete?fit():$("map").onload=fit;
fit();
})();
